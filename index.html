<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        // In AI Studio iFrame container preview, HMR WebSocket is disabled.
        // Mock the Vite HMR WebSocket so that @vite/client never triggers disconnected WebSocket errors.
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          const MockWebSocket = function(url, protocols) {
            const isViteHmr = (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
                              (Array.isArray(protocols) && protocols.some(function(p) { return typeof p === 'string' && p.includes('vite-hmr'); })) ||
                              (typeof url === 'string' && (url.includes('vite-hmr') || url.includes('/@vite')));
            if (isViteHmr) {
              const target = new EventTarget();
              const fakeWs = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                binaryType: 'blob',
                url: String(url),
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener, options) {
                  target.addEventListener(type, listener, options);
                },
                removeEventListener: function(type, listener, options) {
                  target.removeEventListener(type, listener, options);
                },
                dispatchEvent: function(event) {
                  return target.dispatchEvent(event);
                }
              };
              Object.defineProperty(fakeWs, 'onopen', {
                set: function(fn) { target.addEventListener('open', fn); }
              });
              Object.defineProperty(fakeWs, 'onmessage', {
                set: function(fn) { target.addEventListener('message', fn); }
              });
              Object.defineProperty(fakeWs, 'onerror', {
                set: function(fn) { target.addEventListener('error', fn); }
              });
              Object.defineProperty(fakeWs, 'onclose', {
                set: function(fn) { target.addEventListener('close', fn); }
              });
              return fakeWs;
            }
            return new OrigWebSocket(url, protocols);
          };
          MockWebSocket.prototype = OrigWebSocket.prototype;
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;
          window.WebSocket = MockWebSocket;
        }

        // Global safety net for any Vite/WebSocket error suppression
        const isWsError = function(str) {
          if (!str) return false;
          if (typeof str === 'object') {
            const msg = str.message || '';
            const stack = str.stack || '';
            return isWsError(msg) || isWsError(stack);
          }
          if (typeof str === 'string') {
            return str.includes('WebSocket') || str.includes('[vite]') || str.includes('vite-hmr');
          }
          return false;
        };

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(function(arg) { return isWsError(arg); })) {
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(function(arg) { return isWsError(arg); })) {
            return;
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('error', function(event) {
          if (isWsError(event.message) || isWsError(event.error) || (event.filename && event.filename.includes('@vite/client'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

            <span>Cargando catálogo</span>

        </style>
